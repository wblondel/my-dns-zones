name: DNS drift

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
  # Also on the pull requests that change this workflow or its report, to test them.
  pull_request:
    paths:
      - .github/workflows/dns-drift.yml
      - scripts/dns-drift-report.sh

permissions:
  contents: read

jobs:
  drift:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One run at a time, so that two runs cannot open the same issue twice.
    concurrency:
      group: dns-drift
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails when a provider holds records that differ from the ones in this repository, for
      # example after a change made in a provider's dashboard. Nothing is changed at the providers.
      # The drift is reported by the next steps, so this one does not stop the job.
      - name: Compare the live DNS records with the repository
        id: drift
        continue-on-error: true
        uses: wblondel/dnscontrol-action@c47e0e742495410c31ac255276093a46c60f5fe7 # 5.3.0
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DESEC_API_TOKEN: ${{ secrets.DESEC_API_TOKEN }}
          DYNADOT_API_KEY: ${{ secrets.DYNADOT_API_KEY }}
          OVH_APP_KEY: ${{ secrets.OVH_APP_KEY }}
          OVH_APP_SECRET_KEY: ${{ secrets.OVH_APP_SECRET_KEY }}
          OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
          SPACESHIP_API_KEY: ${{ secrets.SPACESHIP_API_KEY }}
          SPACESHIP_API_SECRET: ${{ secrets.SPACESHIP_API_SECRET }}
        with:
          args: preview --expect-no-changes --report drift-report.json --variable home_ip=${{ secrets.HOME_IP }}

      - name: Report the drift
        if: ${{ !cancelled() }}
        env:
          DNSCONTROL_OUTCOME: ${{ steps.drift.outcome }}
          HOME_IP: ${{ secrets.HOME_IP }}
        run: bash scripts/dns-drift-report.sh drift-report.json

      # On master, drifted records are reported as an issue per domain, opened when it starts and
      # closed once the records match again, instead of a failed run notification every day. The
      # run then stays green: it only fails if the issues cannot be updated, or if the comparison
      # did not complete.
      - name: Open and close the issues
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HOME_IP: ${{ secrets.HOME_IP }}
          STEP_OUTCOME: ${{ steps.drift.outcome }}
        run: bash scripts/sync-issues.sh dns-drift drift-report.json

      # Anywhere else (the pull requests that test this workflow), drift fails the run.
      - name: Fail if the records drifted
        if: steps.drift.outcome == 'failure' && github.ref != 'refs/heads/master'
        run: exit 1

      # Tells the heartbeat monitor that the run happened, whatever the result of the comparison:
      # the issues are for the drift, the monitor is for a schedule that stopped.
      - name: Ping the heartbeat monitor
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_DNS_DRIFT_URL }}
        run: bash scripts/heartbeat.sh

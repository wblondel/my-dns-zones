name: Check file and Preview DNS changes

on: pull_request

jobs:
  check:
    if: github.actor!= 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: DNSControl check
        uses: wblondel/dnscontrol-action@648bf97e38aed855b8f43af0cc8428f1dee90a62 # v4.27.1
        with:
          args: check

  preview:
    if: github.actor!= 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DESEC_API_TOKEN: ${{ secrets.DESEC_API_TOKEN }}
      DYNADOT_API_KEY: ${{ secrets.DYNADOT_API_KEY }}
      OVH_APP_KEY: ${{ secrets.OVH_APP_KEY }}
      OVH_APP_SECRET_KEY: ${{ secrets.OVH_APP_SECRET_KEY }}
      OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
    needs: check

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: DNSControl preview
        uses: wblondel/dnscontrol-action@648bf97e38aed855b8f43af0cc8428f1dee90a62 # v4.27.1
        id: dnscontrol_preview
        with:
          args: preview
name: Domain health

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MIN_DAYS: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check DNSSEC and expiry of every domain
        run: bash scripts/domain-health.sh

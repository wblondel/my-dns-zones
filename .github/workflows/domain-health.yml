name: Domain health

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MIN_DAYS: 60

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Check DNSSEC and expiry of every domain
        run: bash scripts/domain-health.sh
